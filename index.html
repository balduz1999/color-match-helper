<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Color Match</title>
<style>
  :root {
    --bg: #111318;
    --panel: #1b1e26;
    --text: #eef0f4;
    --muted: #8a90a0;
    --accent: #4f7cff;
    --danger: #e5533d;
    --chip-bg: #262a35;
  }

  * { box-sizing: border-box; }

  html, body {
    margin: 0;
    padding: 0;
    height: 100%;
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
  }

  #app {
    height: 100vh;
    height: 100dvh;
    display: flex;
    flex-direction: column;
  }

  header {
    padding: 14px 16px;
    text-align: center;
    font-size: 15px;
    font-weight: 600;
    letter-spacing: 0.02em;
    border-bottom: 1px solid #262a35;
  }

  #stage {
    flex: 1;
    position: relative;
    background: #000;
    overflow: hidden;
    min-height: 0;
  }

  video {
    width: 100%;
    height: 100%;
    object-fit: cover;
    display: block;
  }

  #placeholder {
    position: absolute;
    inset: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    flex-direction: column;
    gap: 14px;
    padding: 24px;
    text-align: center;
    color: var(--muted);
  }

  #placeholder p {
    max-width: 280px;
    line-height: 1.5;
    margin: 0;
    font-size: 14px;
  }

  button {
    font-family: inherit;
    font-size: 14px;
    font-weight: 600;
    border: none;
    border-radius: 10px;
    padding: 11px 18px;
    cursor: pointer;
  }

  #startBtn {
    background: var(--accent);
    color: #fff;
    font-size: 15px;
    padding: 14px 22px;
  }

  #startBtn:active {
    opacity: 0.85;
  }

  #status {
    position: absolute;
    top: 12px;
    left: 12px;
    right: 12px;
    padding: 10px 12px;
    border-radius: 10px;
    background: rgba(20, 22, 28, 0.85);
    color: var(--danger);
    font-size: 13px;
    line-height: 1.4;
    display: none;
    z-index: 5;
  }

  #status.visible {
    display: block;
  }

  /* Banner shown while the app is waiting for a tap on the white reference card */
  #calibBanner {
    position: absolute;
    top: 12px;
    left: 12px;
    right: 12px;
    padding: 10px 12px;
    border-radius: 10px;
    background: rgba(79, 124, 255, 0.92);
    color: #fff;
    font-size: 13px;
    line-height: 1.4;
    text-align: center;
    display: none;
    z-index: 5;
  }

  #calibBanner.visible {
    display: block;
  }

  /* Tap marker shown briefly where the user tapped */
  #tapMarker {
    position: absolute;
    width: 34px;
    height: 34px;
    margin-left: -17px;
    margin-top: -17px;
    border: 2px solid #fff;
    border-radius: 50%;
    pointer-events: none;
    display: none;
    box-shadow: 0 0 0 2px rgba(0,0,0,0.4);
  }

  #switchBtn {
    position: absolute;
    top: 12px;
    right: 12px;
    background: rgba(20, 22, 28, 0.85);
    color: var(--text);
    display: none;
    z-index: 4;
  }

  /* Bottom panel holding calibration status, the swatch list, and controls */
  #panel {
    background: var(--panel);
    border-top: 1px solid #262a35;
    padding: 12px 14px 16px;
    flex-shrink: 0;
  }

  #calibRow {
    display: flex;
    align-items: center;
    gap: 10px;
    padding-bottom: 12px;
    margin-bottom: 12px;
    border-bottom: 1px solid #262a35;
  }

  #calibSwatch {
    width: 30px;
    height: 30px;
    border-radius: 7px;
    border: 1px solid rgba(255,255,255,0.15);
    background: #000;
    flex-shrink: 0;
  }

  #calibText {
    flex: 1;
    font-size: 12px;
    color: var(--muted);
    line-height: 1.3;
  }

  #calibText strong {
    color: var(--text);
    display: block;
    font-size: 13px;
  }

  #calibBtn {
    background: #2a2e3a;
    color: var(--text);
    font-size: 12px;
    padding: 9px 12px;
    white-space: nowrap;
  }

  #clearCalibBtn {
    background: none;
    color: var(--danger);
    font-size: 12px;
    padding: 9px 8px;
    display: none;
  }

  #hint {
    color: var(--muted);
    font-size: 13px;
    text-align: center;
    padding: 0 0 10px;
  }

  #chipRow {
    display: flex;
    gap: 10px;
    overflow-x: auto;
    padding-bottom: 10px;
    min-height: 68px;
  }

  .chip {
    flex-shrink: 0;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 4px;
    background: var(--chip-bg);
    border-radius: 12px;
    padding: 8px;
    width: 76px;
    position: relative;
  }

  .chip .swatchBox {
    width: 44px;
    height: 44px;
    border-radius: 8px;
    border: 1px solid rgba(255,255,255,0.15);
  }

  .chip .chipLabel {
    font-size: 10px;
    color: var(--muted);
    text-align: center;
    line-height: 1.2;
  }

  .chip .chipHex {
    font-size: 10px;
    color: var(--text);
  }

  .chip .removeBtn {
    position: absolute;
    top: -6px;
    right: -6px;
    width: 20px;
    height: 20px;
    border-radius: 50%;
    background: var(--danger);
    color: #fff;
    font-size: 12px;
    font-weight: 700;
    line-height: 20px;
    text-align: center;
    padding: 0;
    cursor: pointer;
  }

  #controlRow {
    display: flex;
    gap: 10px;
    justify-content: center;
  }

  #undoBtn {
    background: #2a2e3a;
    color: var(--text);
  }

  #undoBtn:disabled {
    opacity: 0.4;
    cursor: default;
  }

  #resetBtn {
    background: #2a2e3a;
    color: var(--danger);
  }

  #resetBtn:disabled {
    opacity: 0.4;
    cursor: default;
  }
</style>
</head>
<body>
<div id="app">
  <header>Color Match - Camera</header>

  <div id="stage">
    <video id="video" autoplay playsinline muted></video>

    <div id="placeholder">
      <p>Camera access is needed to sample colors from your clothes.</p>
      <button id="startBtn">Start camera</button>
    </div>

    <div id="tapMarker"></div>
    <div id="status"></div>
    <div id="calibBanner">Tap the white reference card</div>
    <button id="switchBtn">Switch camera</button>
  </div>

  <div id="panel">
    <div id="calibRow">
      <div id="calibSwatch"></div>
      <div id="calibText">
        <strong>No white reference set</strong>
        Place a white card in frame and calibrate before scanning colors.
      </div>
      <button id="calibBtn">Calibrate</button>
      <button id="clearCalibBtn">Clear</button>
    </div>

    <div id="hint">Tap the garment's main color to start. Tap again anywhere to add an accent color.</div>
    <div id="chipRow"></div>
    <div id="controlRow">
      <button id="undoBtn" disabled>Undo last</button>
      <button id="resetBtn" disabled>Reset</button>
    </div>
  </div>
</div>

<!-- Hidden canvas used only to read pixel data from the current video frame -->
<canvas id="captureCanvas" style="display:none;"></canvas>

<script>
  const video = document.getElementById('video');
  const stage = document.getElementById('stage');
  const startBtn = document.getElementById('startBtn');
  const switchBtn = document.getElementById('switchBtn');
  const placeholder = document.getElementById('placeholder');
  const statusEl = document.getElementById('status');
  const tapMarker = document.getElementById('tapMarker');
  const calibBanner = document.getElementById('calibBanner');
  const calibSwatch = document.getElementById('calibSwatch');
  const calibText = document.getElementById('calibText');
  const calibBtn = document.getElementById('calibBtn');
  const clearCalibBtn = document.getElementById('clearCalibBtn');
  const hint = document.getElementById('hint');
  const chipRow = document.getElementById('chipRow');
  const undoBtn = document.getElementById('undoBtn');
  const resetBtn = document.getElementById('resetBtn');
  const canvas = document.getElementById('captureCanvas');
  const ctx = canvas.getContext('2d', { willReadFrequently: true });

  let currentStream = null;
  let facingMode = 'environment'; // rear camera by default

  // Ordered list of sampled (and, if a reference is set, corrected) colors
  // for the garment currently being captured. Position carries meaning:
  // index 0 is the main/field color, every following entry is an accent.
  let swatches = [];

  // Raw RGB read from the white reference card. Used to correct every
  // garment sample for the current lighting. Null means uncalibrated.
  let whiteReference = null;

  // When true, the next tap on the video sets the white reference instead
  // of adding a garment swatch.
  let calibrationMode = false;

  const MAX_SWATCHES = 6;

  function showStatus(message) {
    statusEl.textContent = message;
    statusEl.classList.add('visible');
  }

  function hideStatus() {
    statusEl.classList.remove('visible');
  }

  function stopCurrentStream() {
    if (currentStream) {
      currentStream.getTracks().forEach(track => track.stop());
      currentStream = null;
    }
  }

  async function startCamera() {
    hideStatus();

    if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
      showStatus('This browser does not support camera access. Try a recent version of Chrome or Safari.');
      return;
    }

    stopCurrentStream();

    const constraints = {
      video: {
        facingMode: { ideal: facingMode },
        width: { ideal: 1280 },
        height: { ideal: 720 }
      },
      audio: false
    };

    try {
      const stream = await navigator.mediaDevices.getUserMedia(constraints);
      currentStream = stream;
      video.srcObject = stream;
      placeholder.style.display = 'none';
      switchBtn.style.display = 'inline-block';
    } catch (err) {
      if (err.name === 'NotAllowedError') {
        showStatus('Camera permission was denied. Enable camera access for this site in your browser settings.');
      } else if (err.name === 'NotFoundError') {
        showStatus('No camera was found on this device.');
      } else {
        showStatus('Could not start the camera: ' + err.message);
      }
    }
  }

  startBtn.addEventListener('click', startCamera);

  switchBtn.addEventListener('click', () => {
    facingMode = (facingMode === 'environment') ? 'user' : 'environment';
    startCamera();
  });

  // Converts a tap position on the visible video element into a pixel
  // coordinate on the underlying video frame, accounting for object-fit: cover
  // (the video is often cropped to fill its container, so displayed size and
  // actual frame size do not match 1:1).
  function mapTapToVideoCoords(tapX, tapY) {
    const rect = video.getBoundingClientRect();
    const videoWidth = video.videoWidth;
    const videoHeight = video.videoHeight;

    if (!videoWidth || !videoHeight) return null;

    const displayWidth = rect.width;
    const displayHeight = rect.height;

    const videoRatio = videoWidth / videoHeight;
    const displayRatio = displayWidth / displayHeight;

    let renderedWidth, renderedHeight, offsetX, offsetY;

    if (videoRatio > displayRatio) {
      renderedHeight = displayHeight;
      renderedWidth = displayHeight * videoRatio;
      offsetX = (renderedWidth - displayWidth) / 2;
      offsetY = 0;
    } else {
      renderedWidth = displayWidth;
      renderedHeight = displayWidth / videoRatio;
      offsetX = 0;
      offsetY = (renderedHeight - displayHeight) / 2;
    }

    const xInRendered = tapX - rect.left + offsetX;
    const yInRendered = tapY - rect.top + offsetY;

    const scale = videoWidth / renderedWidth;

    const videoX = xInRendered * scale;
    const videoY = yInRendered * scale;

    return { x: Math.round(videoX), y: Math.round(videoY) };
  }

  function rgbToHex(r, g, b) {
    return '#' + [r, g, b].map(v => v.toString(16).padStart(2, '0')).join('');
  }

  // Draws the current video frame to the hidden canvas, then averages a small
  // patch of pixels around the tapped point (rather than a single pixel) to
  // reduce sensor noise and compression artifacts.
  function sampleColorAt(videoX, videoY) {
    canvas.width = video.videoWidth;
    canvas.height = video.videoHeight;
    ctx.drawImage(video, 0, 0, canvas.width, canvas.height);

    const patchSize = 10;
    const half = Math.floor(patchSize / 2);

    const startX = Math.max(0, Math.min(canvas.width - patchSize, videoX - half));
    const startY = Math.max(0, Math.min(canvas.height - patchSize, videoY - half));

    const imageData = ctx.getImageData(startX, startY, patchSize, patchSize);
    const data = imageData.data;

    let rSum = 0, gSum = 0, bSum = 0;
    const pixelCount = patchSize * patchSize;

    for (let i = 0; i < data.length; i += 4) {
      rSum += data[i];
      gSum += data[i + 1];
      bSum += data[i + 2];
    }

    return {
      r: Math.round(rSum / pixelCount),
      g: Math.round(gSum / pixelCount),
      b: Math.round(bSum / pixelCount)
    };
  }

  // Scales a raw RGB reading so the white card's color cast is removed,
  // without inflating overall brightness. Gains are computed relative to
  // the reference's own brightest channel (not 255), since the card rarely
  // reads pure white under normal exposure - forcing it to 255 would push
  // every subsequent reading toward maximum brightness along with it.
  function applyWhiteCorrection(raw) {
    if (!whiteReference) return raw;

    const refR = Math.max(1, whiteReference.r);
    const refG = Math.max(1, whiteReference.g);
    const refB = Math.max(1, whiteReference.b);
    const refMax = Math.max(refR, refG, refB);

    const clamp = (v) => Math.round(Math.max(0, Math.min(255, v)));

    return {
      r: clamp(raw.r * (refMax / refR)),
      g: clamp(raw.g * (refMax / refG)),
      b: clamp(raw.b * (refMax / refB))
    };
  }

  function showTapMarker(x, y) {
    tapMarker.style.left = x + 'px';
    tapMarker.style.top = y + 'px';
    tapMarker.style.display = 'block';
  }

  function updateCalibDisplay() {
    if (whiteReference) {
      const hex = rgbToHex(whiteReference.r, whiteReference.g, whiteReference.b);
      calibSwatch.style.background = hex;
      calibText.innerHTML = '<strong>Calibrated</strong>Reference read as ' + hex.toUpperCase() + '. Recalibrate if the light changes.';
      calibBtn.textContent = 'Recalibrate';
      clearCalibBtn.style.display = 'inline-block';
    } else {
      calibSwatch.style.background = '#000';
      calibText.innerHTML = '<strong>No white reference set</strong>Place a white card in frame and calibrate before scanning colors.';
      calibBtn.textContent = 'Calibrate';
      clearCalibBtn.style.display = 'none';
    }
  }

  calibBtn.addEventListener('click', () => {
    if (!currentStream) {
      showStatus('Start the camera first.');
      return;
    }
    calibrationMode = true;
    calibBanner.classList.add('visible');
  });

  clearCalibBtn.addEventListener('click', () => {
    whiteReference = null;
    updateCalibDisplay();
  });

  // Renders the chip list from the swatches array. Label is derived purely
  // from position: the first swatch is always "Main", every later one is
  // "Accent N". This means removing the main swatch promotes the next one,
  // which matches how the app treats the list (first = field color).
  function renderChips() {
    chipRow.innerHTML = '';

    swatches.forEach((swatch, index) => {
      const chip = document.createElement('div');
      chip.className = 'chip';

      const label = index === 0 ? 'Main' : ('Accent ' + index);

      chip.innerHTML =
        '<div class="swatchBox" style="background:' + swatch.hex + ';"></div>' +
        '<div class="chipLabel">' + label + '</div>' +
        '<div class="chipHex">' + swatch.hex.toUpperCase() + '</div>' +
        '<button class="removeBtn" data-index="' + index + '">x</button>';

      chipRow.appendChild(chip);
    });

    undoBtn.disabled = swatches.length === 0;
    resetBtn.disabled = swatches.length === 0;

    if (swatches.length === 0) {
      hint.textContent = "Tap the garment's main color to start. Tap again anywhere to add an accent color.";
    } else if (swatches.length >= MAX_SWATCHES) {
      hint.textContent = 'Maximum of ' + MAX_SWATCHES + ' colors reached. Remove one to add another.';
    } else {
      hint.textContent = 'Tap to add an accent color, or remove one below.';
    }
  }

  chipRow.addEventListener('click', (event) => {
    const target = event.target;
    if (target.classList.contains('removeBtn')) {
      const index = parseInt(target.getAttribute('data-index'), 10);
      swatches.splice(index, 1);
      renderChips();
    }
  });

  undoBtn.addEventListener('click', () => {
    swatches.pop();
    renderChips();
  });

  resetBtn.addEventListener('click', () => {
    swatches = [];
    renderChips();
  });

  stage.addEventListener('click', (event) => {
    if (!currentStream) return;
    if (event.target === switchBtn || event.target === calibBtn) return;

    const rect = stage.getBoundingClientRect();
    showTapMarker(event.clientX - rect.left, event.clientY - rect.top);

    const videoCoords = mapTapToVideoCoords(event.clientX, event.clientY);
    if (!videoCoords) return;

    const raw = sampleColorAt(videoCoords.x, videoCoords.y);

    if (calibrationMode) {
      whiteReference = raw;
      calibrationMode = false;
      calibBanner.classList.remove('visible');
      updateCalibDisplay();
      return;
    }

    if (swatches.length >= MAX_SWATCHES) return;

    const corrected = applyWhiteCorrection(raw);
    const hex = rgbToHex(corrected.r, corrected.g, corrected.b);

    swatches.push({ r: corrected.r, g: corrected.g, b: corrected.b, hex: hex });
    renderChips();
  });

  window.addEventListener('beforeunload', stopCurrentStream);
</script>
</body>
</html>
